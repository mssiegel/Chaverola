<!doctype html>
<!-- lang/dir are the ENGLISH shell's values. main.tsx rewrites both before
     React mounts, so a /he load paints RTL on frame 1; they're spelled out
     here so the attributes always exist and the first layout can't reflow
     from a missing dir. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget: the on-screen keyboard resizes the layout viewport
         (Android Chrome), so dvh-sized screens shrink and inputs land above
         the keys instead of the browser panning the page. iOS ignores it.
         viewport-fit=cover: without it iOS letterboxes the page inside the
         notch and home-indicator bars AND reports every env(safe-area-inset-*)
         as 0. With it the page runs edge to edge under that chrome, and the
         env() paddings in StudentWorldLayout, AppLayout's navbar, DemoBanner,
         and the teacher setup dock are what keep content out of it. Never add
         one without the other. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6C4BE0" />
    <!-- The shell's own pair, and the ONLY one a link-preview bot ever sees:
         Slack, WhatsApp and Gmail read this raw HTML and never run the JS that
         swaps in the route's meta, so this description is what every pasted
         Chaverola link unfurls as, /demo included. Third person on purpose —
         it has to read correctly on a student URL too.
         The title stays the bare brand. Nothing stamps a title before React
         mounts, so this is what sits in the tab during the lazy page fetch,
         and a full English sentence there would flash English at a Hebrew
         student on school wifi. Length belongs in the description, which no
         human reads. -->
    <meta
      name="description"
      content="A free classroom activity where students play secret characters and chat with each other about the lesson. The teacher sees every chat live, by name."
    />
    <title>Chaverola</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
